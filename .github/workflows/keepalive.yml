name: Keepalive

# GitHub automatically disables scheduled workflows in a public repository after
# 60 days without repository activity. The daily history commit normally counts
# as activity, but on a run of quiet days (nothing new to record, no commit)
# the schedule could still lapse. This weekly no-op guarantees the repo never
# goes idle long enough to be disabled.

on:
  schedule:
    - cron: "23 4 * * 1"   # 04:23 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive timestamp
        run: |
          git config user.name  "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || exit 0
          git push
